<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="44%">
      <stop offset="0%" stop-color="#0a1e40" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#061220" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#060b14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="25%" stop-color="#1976d2"/>
      <stop offset="65%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#051a3d"/>
    </radialGradient>
    <radialGradient id="earthglow" cx="50%" cy="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="moongr" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#455a64"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="earthfilt">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="moonfilt">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Orbit paths for animateMotion -->
    <path id="satpath" d="M 650,105 A 200,62 0 1,0 250,105 A 200,62 0 1,0 650,105"/>
    <path id="moonpath" d="M 760,105 A 310,88 0 1,0 140,105 A 310,88 0 1,0 760,105"/>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bg)"/>
  <rect width="900" height="240" fill="url(#nebula)"/>

  <!-- Stars -->
  <circle cx="28" cy="19" r="1" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.1s" begin="0s" repeatCount="indefinite"/></circle>
  <circle cx="82" cy="44" r="1.4" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="134" cy="17" r="1" fill="#c5cae9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="188" cy="52" r="1.2" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="243" cy="24" r="1" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.3s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="308" cy="40" r="1.5" fill="#c5cae9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.9s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="372" cy="14" r="1" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="418" cy="68" r="1.2" fill="#fff" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="2.0s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="492" cy="30" r="1" fill="#c5cae9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="1.7s" begin="1.3s" repeatCount="indefinite"/></circle>
  <circle cx="538" cy="55" r="1.4" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="598" cy="19" r="1" fill="#fff" opacity="0.65"><animate attributeName="opacity" values="0.65;0.1;0.65" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle>
  <circle cx="658" cy="46" r="1.2" fill="#c5cae9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" begin="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="718" cy="27" r="1" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.1s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="774" cy="52" r="1.5" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.9s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="832" cy="21" r="1" fill="#c5cae9" opacity="0.65"><animate attributeName="opacity" values="0.65;0.1;0.65" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="878" cy="40" r="1.2" fill="#fff" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="2.0s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="58" cy="82" r="1" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.3s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="108" cy="95" r="1.4" fill="#c5cae9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.7s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="162" cy="74" r="1" fill="#fff" opacity="0.75"><animate attributeName="opacity" values="0.75;0.1;0.75" dur="2.0s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="215" cy="88" r="1.2" fill="#fff" opacity="0.65"><animate attributeName="opacity" values="0.65;0.2;0.65" dur="1.8s" begin="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="625" cy="86" r="1" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="685" cy="70" r="1.3" fill="#c5cae9" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="745" cy="92" r="1" fill="#fff" opacity="0.65"><animate attributeName="opacity" values="0.65;0.1;0.65" dur="1.9s" begin="1.3s" repeatCount="indefinite"/></circle>
  <circle cx="805" cy="76" r="1.4" fill="#fff" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="2.1s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="858" cy="88" r="1" fill="#c5cae9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.5s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="18" cy="145" r="1.2" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.7s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="72" cy="160" r="1" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.2s" begin="0.1s" repeatCount="indefinite"/></circle>
  <circle cx="128" cy="148" r="1.5" fill="#c5cae9" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="1.9s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="198" cy="168" r="1" fill="#fff" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="262" cy="153" r="1.2" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.0s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="332" cy="166" r="1" fill="#c5cae9" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="582" cy="150" r="1.4" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.3s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="165" r="1" fill="#fff" opacity="0.75"><animate attributeName="opacity" values="0.75;0.15;0.75" dur="1.7s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="722" cy="152" r="1.2" fill="#c5cae9" opacity="0.65"><animate attributeName="opacity" values="0.65;0.2;0.65" dur="2.1s" begin="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="788" cy="168" r="1" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.9s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="848" cy="153" r="1.5" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle>
  <circle cx="892" cy="160" r="1" fill="#c5cae9" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="2.0s" begin="0.9s" repeatCount="indefinite"/></circle>

  <!-- Moon orbit path (faintest) -->
  <path d="M 760,105 A 310,88 0 1,0 140,105 A 310,88 0 1,0 760,105" fill="none" stroke="#1a2a42" stroke-width="0.6" stroke-dasharray="3 6"/>

  <!-- Satellite orbit path -->
  <path d="M 650,105 A 200,62 0 1,0 250,105 A 200,62 0 1,0 650,105" fill="none" stroke="#1e3a6e" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Moon (moving on outer orbit) -->
  <g filter="url(#moonfilt)">
    <circle r="9" fill="url(#moongr)"/>
    <animateMotion dur="14s" repeatCount="indefinite">
      <mpath href="#moonpath"/>
    </animateMotion>
  </g>

  <!-- Earth glow halo -->
  <circle cx="450" cy="105" r="52" fill="none" stroke="#1565c0" stroke-width="6" opacity="0.15" filter="url(#earthfilt)"/>
  <!-- Earth -->
  <circle cx="450" cy="105" r="38" fill="url(#earth)" filter="url(#earthfilt)"/>
  <!-- Atmosphere ring -->
  <circle cx="450" cy="105" r="42" fill="url(#earthglow)"/>
  <!-- Cloud wisps -->
  <path d="M 428,92 Q 448,87 462,94" fill="none" stroke="white" stroke-width="2.5" opacity="0.25" stroke-linecap="round"/>
  <path d="M 436,108 Q 452,103 466,109" fill="none" stroke="white" stroke-width="2" opacity="0.18" stroke-linecap="round"/>
  <path d="M 434,119 Q 446,116 458,120" fill="none" stroke="white" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>

  <!-- Satellite (moving on inner orbit) -->
  <g filter="url(#glow)">
    <!-- Main body -->
    <rect x="-7" y="-3.5" width="14" height="7" fill="#cfd8dc" rx="1.5"/>
    <!-- Center detail -->
    <rect x="-2" y="-3.5" width="4" height="7" fill="#90a4ae"/>
    <!-- Left solar panel -->
    <rect x="-20" y="-2" width="11" height="4" fill="#1e88e5" rx="0.5"/>
    <line x1="-16" y1="-2" x2="-16" y2="2" stroke="#64b5f6" stroke-width="0.6"/>
    <line x1="-13" y1="-2" x2="-13" y2="2" stroke="#64b5f6" stroke-width="0.6"/>
    <!-- Right solar panel -->
    <rect x="9" y="-2" width="11" height="4" fill="#1e88e5" rx="0.5"/>
    <line x1="13" y1="-2" x2="13" y2="2" stroke="#64b5f6" stroke-width="0.6"/>
    <line x1="16" y1="-2" x2="16" y2="2" stroke="#64b5f6" stroke-width="0.6"/>
    <!-- Antenna -->
    <line x1="0" y1="-3.5" x2="0" y2="-9" stroke="#90caf9" stroke-width="0.8"/>
    <circle cx="0" cy="-10.5" r="1.5" fill="#42a5f5"/>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#satpath"/>
    </animateMotion>
  </g>

  <!-- Bottom gradient overlay for text readability -->
  <linearGradient id="bottomfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#060b14" stop-opacity="0.85"/>
  </linearGradient>
  <rect y="140" width="900" height="100" fill="url(#bottomfade)"/>

  <!-- Name -->
  <text x="450" y="192"
    font-family="'Courier New', Courier, monospace"
    font-size="24"
    font-weight="bold"
    fill="#e8eaf6"
    text-anchor="middle"
    letter-spacing="6">ROHIT MICHAEL RAJ</text>

  <!-- Tagline -->
  <text x="450" y="218"
    font-family="'Courier New', Courier, monospace"
    font-size="10.5"
    fill="#42a5f5"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.85">ML  ·  AEROSPACE  ·  BUILDER  ·  VIT CHENNAI</text>
</svg>
